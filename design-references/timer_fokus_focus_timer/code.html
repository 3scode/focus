<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TimeBlocking | Timer Fokus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffdbcc",
                        "on-secondary-container": "#684000",
                        "surface-container-low": "#f5f2ff",
                        "on-background": "#1b1b24",
                        "inverse-primary": "#c3c0ff",
                        "inverse-on-surface": "#f3effc",
                        "inverse-surface": "#302f39",
                        "secondary-container": "#fea619",
                        "on-secondary-fixed-variant": "#653e00",
                        "surface-container": "#f0ecf9",
                        "surface-container-high": "#eae6f4",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "secondary": "#855300",
                        "on-surface-variant": "#464555",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#3323cc",
                        "primary-container": "#4f46e5",
                        "on-primary-container": "#dad7ff",
                        "surface-variant": "#e4e1ee",
                        "outline": "#777587",
                        "tertiary": "#7e3000",
                        "on-tertiary-fixed": "#351000",
                        "surface-dim": "#dcd8e5",
                        "surface-container-highest": "#e4e1ee",
                        "secondary-fixed-dim": "#ffb95f",
                        "on-primary-fixed": "#0f0069",
                        "error-container": "#ffdad6",
                        "on-surface": "#1b1b24",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#3525cd",
                        "error": "#ba1a1a",
                        "outline-variant": "#c7c4d8",
                        "secondary-fixed": "#ffddb8",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#2a1700",
                        "surface-tint": "#4d44e3",
                        "surface-bright": "#fcf8ff",
                        "on-tertiary-container": "#ffd2be",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-secondary": "#ffffff",
                        "background": "#fcf8ff",
                        "primary-fixed": "#e2dfff",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "tertiary-container": "#a44100"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "margin-mobile": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "gutter": "16px",
                        "md": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "body": ["Inter"],
                        "h2": ["Inter"],
                        "h2-mobile": ["Inter"],
                        "h1": ["Inter"],
                        "h1-mobile": ["Inter"],
                        "label": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "h3": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "h2": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "h2-mobile": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "h1": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "h1-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .timer-ring {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .pulse-soft {
            animation: pulse-soft 3s infinite ease-in-out;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(1.05); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body overflow-hidden">
<!-- Top Navigation -->
<header class="fixed top-0 left-0 w-full h-16 flex items-center justify-between px-margin-mobile md:px-margin-desktop z-50">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-h2 text-h2 font-bold text-primary tracking-tight">TimeBlocking</span>
</div>
<a class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors group" href="/">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface">close</span>
</a>
</header>
<!-- Main Content Area -->
<main class="relative min-h-screen w-full flex flex-col items-center justify-center px-margin-mobile">
<!-- Subtle Ambient Background Effect -->
<div class="absolute inset-0 flex items-center justify-center overflow-hidden pointer-events-none">
<div class="w-[600px] h-[600px] bg-secondary-container/10 rounded-full blur-[120px] pulse-soft"></div>
</div>
<div class="relative z-10 w-full max-w-md flex flex-col items-center fade-in">
<!-- Circular Timer Display -->
<div class="relative w-72 h-72 md:w-80 md:h-80 flex items-center justify-center mb-xl">
<!-- Background Circle -->
<svg class="absolute inset-0 w-full h-full">
<circle class="text-surface-container-highest" cx="50%" cy="50%" fill="transparent" r="48%" stroke="currentColor" stroke-width="8"></circle>
<!-- Animated Amber Arc -->
<circle class="timer-ring" cx="50%" cy="50%" fill="transparent" r="48%" stroke="#F59E0B" stroke-dasharray="1005" stroke-dashoffset="250" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="flex flex-col items-center">
<span class="font-h1 text-[64px] md:text-[80px] leading-none tracking-tighter text-on-surface font-bold">24:59</span>
<span class="font-label text-label text-on-surface-variant uppercase tracking-widest mt-xs">Tersisa</span>
</div>
</div>
<!-- Current Block Info -->
<div class="text-center mb-lg w-full">
<h2 class="font-h2 text-h2 text-on-surface">Kerja: Desain UI</h2>
<p class="font-body text-on-surface-variant mt-xs">09:00 — 09:25</p>
</div>
<!-- Linear Progress Bar -->
<div class="w-full h-1 bg-surface-container-highest rounded-full overflow-hidden mb-xl">
<div class="h-full bg-secondary-container w-[75%] transition-all duration-1000 ease-linear"></div>
</div>
<!-- Control: Large Pause Button -->
<button class="w-20 h-20 rounded-full bg-white border border-outline-variant flex items-center justify-center shadow-sm hover:shadow-md hover:scale-105 active:scale-95 transition-all mb-xl group" id="main-timer-control">
<span class="material-symbols-outlined text-4xl text-on-surface group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<!-- Action Buttons Row -->
<div class="flex items-center gap-md w-full">
<button class="flex-1 h-11 rounded-lg font-label text-on-surface-variant border border-outline-variant hover:bg-surface-container-high transition-colors">
                Lewati
            </button>
<button class="flex-1 h-11 rounded-lg bg-primary text-white font-label shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-sm">
                Selesai
            </button>
</div>
</div>
</main>
<!-- Bottom Quote Decoration -->
<footer class="fixed bottom-margin-mobile left-0 w-full text-center px-margin-mobile">
<p class="font-body-sm italic text-on-surface-variant/60 max-w-xs mx-auto">
        "Fokus adalah masalah memutuskan hal-hal apa yang tidak akan Anda lakukan."
    </p>
</footer>
<script>
    // Simple Interaction logic for demo
    const controlBtn = document.getElementById('main-timer-control');
    const iconSpan = controlBtn.querySelector('.material-symbols-outlined');
    let isPlaying = true;

    controlBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
            iconSpan.textContent = 'pause';
            iconSpan.style.fontVariationSettings = "'FILL' 1";
        } else {
            iconSpan.textContent = 'play_arrow';
            iconSpan.style.fontVariationSettings = "'FILL' 1";
        }
    });

    // Dynamic arc adjustment simulation
    let offset = 250;
    const ring = document.querySelector('.timer-ring');
    setInterval(() => {
        if(isPlaying && offset < 1005) {
            offset += 0.5;
            ring.style.strokeDashoffset = offset;
        }
    }, 1000);
</script>
</body></html>
